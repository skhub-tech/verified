<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>InstaFuse · Changelog</title>
  <style>
    :root {
      --ig-purple: #833AB4;
      --ig-pink: #E1306C;
      --ig-orange: #F77737;
      --ig-yellow: #FCAF45;
      --ig-gradient: linear-gradient(135deg, #833AB4 0%, #E1306C 50%, #F77737 100%);
      --ig-gradient-soft: linear-gradient(135deg, rgba(131,58,180,0.08) 0%, rgba(225,48,108,0.08) 50%, rgba(247,119,55,0.08) 100%);

      --bg: #fafafa;
      --bg-card: #ffffff;
      --bg-card-hover: #f5f5f5;
      --text-primary: #0b0b0b;
      --text-secondary: #555;
      --text-muted: #999;
      --border: rgba(0,0,0,0.08);
      --border-hover: rgba(131,58,180,0.3);
      --shadow: 0 2px 12px rgba(0,0,0,0.04);
      --shadow-hover: 0 8px 28px rgba(225,48,108,0.1);
      --badge-bg: rgba(131,58,180,0.06);
      --base-bg: rgba(131,58,180,0.04);
      --footer-border: rgba(0,0,0,0.06);
      --loading-color: #E1306C;
      --error-color: #c0392b;
      --download-bg: var(--ig-gradient);
      --download-shadow: 0 4px 16px rgba(225,48,108,0.25);
      --download-shadow-hover: 0 6px 24px rgba(225,48,108,0.35);
      --toggle-bg: #e9e9e9;
      --toggle-knob: #ffffff;
      --toggle-active: var(--ig-gradient);
    }

    [data-theme="dark"] {
      --bg: #121212;
      --bg-card: #1e1e1e;
      --bg-card-hover: #262626;
      --text-primary: #f0f0f0;
      --text-secondary: #a0a0a0;
      --text-muted: #666;
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(225,48,108,0.4);
      --shadow: 0 2px 12px rgba(0,0,0,0.2);
      --shadow-hover: 0 8px 28px rgba(0,0,0,0.3);
      --badge-bg: rgba(255,255,255,0.04);
      --base-bg: rgba(255,255,255,0.03);
      --footer-border: rgba(255,255,255,0.06);
      --loading-color: #F77737;
      --toggle-bg: #333;
      --toggle-knob: #888;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .changelog-container {
      max-width: 720px;
      width: 100%;
    }

    /* ===== Header ===== */
    .changelog-header {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .app-icon {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: var(--ig-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 4px 14px rgba(225,48,108,0.3);
      flex-shrink: 0;
    }

    .app-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: var(--ig-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .version-badge {
      background: var(--ig-gradient);
      color: white;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 18px;
      border-radius: 40px;
      box-shadow: 0 4px 12px rgba(225,48,108,0.2);
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    /* ===== Theme Toggle ===== */
    .theme-toggle {
      position: relative;
      width: 54px;
      height: 28px;
      background: var(--toggle-bg);
      border-radius: 40px;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .theme-toggle.active {
      background: var(--ig-gradient);
      border-color: transparent;
    }

    .toggle-knob {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 22px;
      height: 22px;
      background: var(--toggle-knob);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .theme-toggle.active .toggle-knob {
      left: calc(100% - 26px);
      background: #fff;
    }

    /* ===== Version Card ===== */
    .version-card {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 20px 22px 18px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .version-card.latest {
      border-color: transparent;
      border-image: var(--ig-gradient) 1;
      background: var(--bg-card);
      box-shadow: 0 4px 20px rgba(225,48,108,0.08);
    }

    .version-card.latest::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--ig-gradient);
    }

    .version-card:hover {
      box-shadow: var(--shadow-hover);
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .version-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px 12px;
      margin-bottom: 10px;
    }

    .version-tag {
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .version-tag small {
      font-weight: 600;
      font-size: 11px;
      color: #fff;
      background: var(--ig-gradient);
      padding: 2px 12px;
      border-radius: 30px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .version-base {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--base-bg);
      padding: 3px 14px;
      border-radius: 30px;
      border: 1px solid var(--border);
    }

    .version-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-left: 2px;
    }

    /* ===== Change Group ===== */
    .change-group {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px 12px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }

    .change-group:last-child {
      border-bottom: none;
    }

    .change-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 12px;
      border-radius: 40px;
      letter-spacing: 0.3px;
      white-space: nowrap;
      background: var(--badge-bg);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .change-badge.new { background: rgba(131,58,180,0.1); color: #833AB4; border-color: rgba(131,58,180,0.15); }
    [data-theme="dark"] .change-badge.new { background: rgba(131,58,180,0.2); color: #c084fc; }
    .change-badge.fix { background: rgba(108,117,125,0.1); color: #6c757d; border-color: rgba(108,117,125,0.15); }
    [data-theme="dark"] .change-badge.fix { background: rgba(160,160,160,0.15); color: #a0a0a0; }
    .change-badge.imp { background: rgba(25,135,84,0.1); color: #198754; border-color: rgba(25,135,84,0.15); }
    [data-theme="dark"] .change-badge.imp { background: rgba(25,135,84,0.2); color: #4ade80; }
    .change-badge.add { background: rgba(225,48,108,0.1); color: #E1306C; border-color: rgba(225,48,108,0.15); }
    [data-theme="dark"] .change-badge.add { background: rgba(225,48,108,0.2); color: #f472b6; }
    .change-badge.major { background: rgba(247,119,55,0.1); color: #F77737; border-color: rgba(247,119,55,0.15); }
    [data-theme="dark"] .change-badge.major { background: rgba(247,119,55,0.2); color: #fb923c; }

    .change-text {
      font-size: 15px;
      font-weight: 450;
      color: var(--text-primary);
      flex: 1;
      min-width: 120px;
      line-height: 1.4;
    }

    /* ===== Mini Features ===== */
    .mini-features {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
      padding-top: 8px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .mini-features span {
      background: var(--badge-bg);
      padding: 3px 12px;
      border-radius: 30px;
      border: 1px solid var(--border);
    }

    /* ===== Download Button ===== */
    .download-section {
      margin-top: 20px;
      text-align: center;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--download-bg);
      color: white;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 36px;
      border-radius: 40px;
      text-decoration: none;
      box-shadow: var(--download-shadow);
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--download-shadow-hover);
    }

    .download-btn:active {
      transform: translateY(0);
    }

    /* ===== Footer ===== */
    .changelog-footer {
      margin-top: 28px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      padding-top: 18px;
      border-top: 1px solid var(--footer-border);
      letter-spacing: 0.3px;
      font-weight: 400;
    }

    .changelog-footer span {
      background: var(--ig-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 600;
    }

    /* ===== Loading ===== */
    .loading {
      text-align: center;
      padding: 40px 20px;
      color: var(--loading-color);
      font-size: 16px;
      font-weight: 500;
    }

    /* ===== Responsive ===== */
    @media (max-width: 600px) {
      body { padding: 14px 10px 30px; }
      .version-card { padding: 16px 16px 14px; border-radius: 20px; }
      .version-tag { font-size: 18px; }
      .change-text { font-size: 14px; min-width: 100px; }
      .version-head { gap: 4px 10px; }
      .change-group { gap: 4px 8px; padding: 6px 0; }
      .change-badge { font-size: 10px; padding: 2px 10px; }
      .app-title { font-size: 22px; }
      .app-icon { width: 42px; height: 42px; border-radius: 14px; font-size: 22px; }
      .header-right { gap: 10px; }
      .version-badge { font-size: 12px; padding: 5px 14px; }
      .download-btn { font-size: 15px; padding: 12px 28px; }
    }

    @media (max-width: 420px) {
      .change-group { flex-direction: column; align-items: flex-start; gap: 3px; }
      .change-text { width: 100%; }
    }
  </style>
</head>
<body>
<div class="changelog-container" id="app">

  <div class="changelog-header">
    <div class="header-left">
      <div class="app-icon">📱</div>
      <span class="app-title" id="appTitle">InstaFuse</span>
    </div>
    <div class="header-right">
      <span class="version-badge" id="latestBadge">Loading...</span>
      <div class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
        <div class="toggle-knob" id="toggleKnob">🌙</div>
      </div>
    </div>
  </div>

  <div id="versionList">
    <div class="loading">⏳ Loading changelog...</div>
  </div>

  <div class="download-section">
    <a href="https://InstaFuse.vercel.app" class="download-btn" target="_blank" rel="noopener">
      ⬇️ Download Latest Version
    </a>
  </div>

  <div class="changelog-footer">
    <span>InstaFuse</span> · changelog · built for webview
  </div>
</div>

<script>
  // ================================================================
  // 🌗 Theme Management
  // ================================================================

  function toggleTheme() {
    const body = document.body;
    const toggle = document.getElementById('themeToggle');
    const knob = document.getElementById('toggleKnob');

    if (body.getAttribute('data-theme') === 'dark') {
      body.removeAttribute('data-theme');
      toggle.classList.remove('active');
      knob.textContent = '🌙';
      localStorage.setItem('instafuse-theme', 'light');
    } else {
      body.setAttribute('data-theme', 'dark');
      toggle.classList.add('active');
      knob.textContent = '☀️';
      localStorage.setItem('instafuse-theme', 'dark');
    }
  }

  // Restore saved theme
  (function initTheme() {
    const saved = localStorage.getItem('instafuse-theme');
    if (saved === 'dark') {
      document.body.setAttribute('data-theme', 'dark');
      document.getElementById('themeToggle').classList.add('active');
      document.getElementById('toggleKnob').textContent = '☀️';
    }
  })();

  // ================================================================
  // 📦 FETCH DATA from external JSON file
  // ================================================================

  async function loadChangelog() {
    try {
      const response = await fetch('changelog.json');
      if (!response.ok) throw new Error('Failed to load changelog.json');
      const data = await response.json();
      renderChangelog(data);
    } catch (error) {
      console.error('Error loading changelog:', error);
      document.getElementById('versionList').innerHTML = `
        <div class="loading" style="color:var(--error-color);">
          ❌ Failed to load changelog. Please check the JSON file.
        </div>
      `;
    }
  }

  // ================================================================
  // 🏗️ RENDER ENGINE
  // ================================================================

  function renderChangelog(data) {
    const { appName, latestVersion, changelog, downloadUrl } = data;

    document.getElementById('appTitle').textContent = appName;
    document.getElementById('latestBadge').textContent = `${latestVersion} · latest`;

    if (downloadUrl) {
      const btn = document.querySelector('.download-btn');
      if (btn) btn.href = downloadUrl;
    }

    const container = document.getElementById('versionList');
    let html = '';

    changelog.forEach((entry) => {
      const isLatest = entry.badge === 'latest';
      const cardClass = isLatest ? 'version-card latest' : 'version-card';
      const badgeHtml = entry.badge ? `<small>${entry.badge}</small>` : '';
      const baseHtml = entry.base ? `<span class="version-base">${entry.base}</span>` : '';

      let changesHtml = '';
      if (entry.changes && entry.changes.length) {
        entry.changes.forEach((change) => {
          const badgeClass = change.badge || 'add';
          changesHtml += `
            <div class="change-group">
              <span class="change-badge ${badgeClass}">${getBadgeLabel(change.badge)}</span>
              <span class="change-text">${change.text}</span>
            </div>
          `;
        });
      }

      let miniHtml = '';
      if (entry.miniFeatures && entry.miniFeatures.length) {
        miniHtml = `<div class="mini-features">${entry.miniFeatures.map(f => `<span>${f}</span>`).join('')}</div>`;
      }

      html += `
        <div class="${cardClass}">
          <div class="version-head">
            <span class="version-tag">${entry.version} ${badgeHtml}</span>
            ${baseHtml}
          </div>
          <div class="version-details">
            ${changesHtml}
            ${miniHtml}
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
  }

  function getBadgeLabel(type) {
    const map = {
      'new': '✨ New',
      'add': '➕ Added',
      'fix': '🛠️ Fixed',
      'imp': '⚡ Improved',
      'major': '⚠️ Major'
    };
    return map[type] || '🔹 Update';
  }

  // ================================================================
  // 🚀 Start
  // ================================================================

  document.addEventListener('DOMContentLoaded', loadChangelog);
</script>
</body>
</html>

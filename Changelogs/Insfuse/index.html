<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>InstaFuse · Changelog</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: #f2f5fa;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .changelog-container {
      max-width: 820px;
      width: 100%;
    }

    .changelog-header {
      margin-bottom: 28px;
      padding-bottom: 12px;
      border-bottom: 2px solid rgba(0, 0, 0, 0.05);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .app-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(145deg, #0d1b3e, #1b2f5c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .version-badge {
      background: #0d1b3e;
      color: white;
      font-size: 14px;
      font-weight: 600;
      padding: 4px 18px;
      border-radius: 40px;
      background: #1a2d5a;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.04);
      letter-spacing: 0.3px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .version-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 28px;
      padding: 18px 20px 16px;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
      transition: all 0.15s ease;
    }

    .version-card:hover {
      background: rgba(255, 255, 255, 0.85);
      border-color: rgba(255, 255, 255, 0.95);
      box-shadow: 0 8px 24px -12px rgba(0, 20, 50, 0.12);
    }

    .version-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px 14px;
      margin-bottom: 8px;
    }

    .version-tag {
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -0.01em;
      color: #0b1a3b;
    }

    .version-tag small {
      font-weight: 400;
      font-size: 13px;
      color: #3a4f7a;
      background: rgba(0,0,0,0.02);
      padding: 0 10px;
      border-radius: 30px;
      opacity: 0.7;
    }

    .version-base {
      font-size: 13px;
      font-weight: 450;
      color: #3a4f7a;
      background: rgba(0,0,0,0.02);
      padding: 2px 14px;
      border-radius: 30px;
      border: 1px solid rgba(0,0,0,0.02);
    }

    .version-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-left: 4px;
    }

    .change-group {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px 12px;
      padding: 4px 0;
      border-bottom: 1px dashed rgba(0, 0, 0, 0.03);
    }

    .change-group:last-child {
      border-bottom: none;
    }

    .change-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 12px;
      border-radius: 40px;
      background: #eef2f6;
      color: #1f2a4a;
      letter-spacing: 0.2px;
      white-space: nowrap;
      border: 1px solid rgba(0,0,0,0.02);
    }

    .change-badge.new { background: #dbeafe; color: #1e3a8a; border-color: #b7d0f0; }
    .change-badge.fix { background: #f0f2f5; color: #2c3e50; }
    .change-badge.imp { background: #e6f0ea; color: #1a4b3a; }
    .change-badge.add { background: #e6f0fa; color: #1a3a6b; }
    .change-badge.major { background: #f1e6fa; color: #5a2d7a; }

    .change-text {
      font-size: 15px;
      font-weight: 450;
      color: #16213e;
      flex: 1;
      min-width: 120px;
    }

    .mini-features {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      padding-top: 6px;
      font-size: 14px;
      color: #1f2a4a;
      opacity: 0.8;
    }

    .mini-features span {
      background: rgba(0,0,0,0.02);
      padding: 2px 12px;
      border-radius: 30px;
      border: 1px solid rgba(0,0,0,0.02);
    }

    .changelog-footer {
      margin-top: 28px;
      text-align: center;
      font-size: 13px;
      color: #3b4e72;
      opacity: 0.4;
      padding-top: 18px;
      border-top: 1px solid rgba(0,0,0,0.02);
      letter-spacing: 0.3px;
      font-weight: 400;
    }

    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #3a4f7a;
      font-size: 16px;
    }

    @media (max-width: 600px) {
      body { padding: 14px 10px 30px; }
      .version-card { padding: 14px 14px 12px; border-radius: 24px; }
      .version-tag { font-size: 18px; }
      .change-text { font-size: 14px; min-width: 100px; }
      .version-head { gap: 4px 10px; }
      .change-group { gap: 4px 8px; padding: 6px 0; }
      .change-badge { font-size: 11px; padding: 1px 10px; }
      .app-title { font-size: 24px; }
    }

    @media (max-width: 420px) {
      .change-group { flex-direction: column; align-items: flex-start; gap: 2px; }
      .change-text { width: 100%; }
    }
  </style>
</head>
<body>
<div class="changelog-container" id="app">

  <div class="changelog-header">
    <span class="app-title" id="appTitle">📱 InstaFuse</span>
    <span class="version-badge" id="latestBadge">Loading...</span>
  </div>

  <div id="versionList">
    <div class="loading">⏳ Loading changelog...</div>
  </div>

  <div class="changelog-footer">
    InstaFuse · changelog · built for webview
  </div>
</div>

<script>
  // ================================================================
  // 📦 FETCH DATA from external JSON file
  // ================================================================

  async function loadChangelog() {
    try {
      const response = await fetch('changelog.json');
      if (!response.ok) throw new Error('Failed to load changelog.json');
      const data = await response.json();
      renderChangelog(data);
    } catch (error) {
      console.error('Error loading changelog:', error);
      document.getElementById('versionList').innerHTML = `
        <div class="loading" style="color:#c0392b;">
          ❌ Failed to load changelog. Please check the JSON file.
        </div>
      `;
    }
  }

  // ================================================================
  // 🏗️ RENDER ENGINE – builds HTML from the data
  // ================================================================

  function renderChangelog(data) {
    const { appName, latestVersion, changelog } = data;

    // update header
    document.getElementById('appTitle').textContent = `📱 ${appName}`;
    document.getElementById('latestBadge').textContent = `${latestVersion} · latest`;

    const container = document.getElementById('versionList');
    let html = '';

    changelog.forEach((entry) => {
      const badgeHtml = entry.badge ? `<small>${entry.badge}</small>` : '';
      const baseHtml = entry.base ? `<span class="version-base">${entry.base}</span>` : '';

      let changesHtml = '';
      if (entry.changes && entry.changes.length) {
        entry.changes.forEach((change) => {
          const badgeClass = change.badge || 'add';
          changesHtml += `
            <div class="change-group">
              <span class="change-badge ${badgeClass}">${getBadgeLabel(change.badge)}</span>
              <span class="change-text">${change.text}</span>
            </div>
          `;
        });
      }

      let miniHtml = '';
      if (entry.miniFeatures && entry.miniFeatures.length) {
        miniHtml = `<div class="mini-features">${entry.miniFeatures.map(f => `<span>${f}</span>`).join('')}</div>`;
      }

      html += `
        <div class="version-card">
          <div class="version-head">
            <span class="version-tag">${entry.version} ${badgeHtml}</span>
            ${baseHtml}
          </div>
          <div class="version-details">
            ${changesHtml}
            ${miniHtml}
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
  }

  function getBadgeLabel(type) {
    const map = {
      'new': '✨ new',
      'add': '➕ add',
      'fix': '🛠️ fix',
      'imp': '📈 imp',
      'major': '⭐ major'
    };
    return map[type] || '🔹 add';
  }

  // ================================================================
  // 🚀 Start
  // ================================================================

  document.addEventListener('DOMContentLoaded', loadChangelog);
</script>
</body>
</html>
